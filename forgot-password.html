<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot Password - Work Place</title><link rel="stylesheet" href="style.css"><style>.forgot-wrap{max-width:520px;margin:50px auto}.step{display:none}.step.show{display:block}.msg{display:none;padding:11px;border-radius:9px;margin:12px 0}.msg.ok{display:block;background:#ecfdf5;color:#166534}.msg.err{display:block;background:#fef2f2;color:#991b1b}</style></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" alt="Work Place" class="brand-logo"></a><div class="navlinks"><a href="index.html">Home</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a><a href="entertainment.html">Entertainment</a><a href="advertisement.html">Advertisement</a><a href="payments.html">Payments</a><a href="appeal-history.html">Appeals</a><a href="messaging.html" class="message-nav" title="Messaging">💬</a><a class="coin-nav" href="coins.html" title="Coins & Rewards"><img src="assets/work-place-coin-logo.png" alt="Coins" style="width:24px;height:24px;vertical-align:middle"></a><div class="notification-wrap"><button class="notification-button" type="button" aria-label="Notifications" title="Notifications">🔔<span class="notification-count" style="display:none">0</span></button><div class="notification-panel"><div class="notification-head"><b>Notifications</b><button type="button" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="notification-list"><div class="notification-empty">Loading…</div></div></div></div></div><div class="user-area"><a class="profile-icon-link" href="profile.html" title="Profile" aria-label="Profile">👤</a><a class="btn login-link" href="login.html">Login / Sign Up</a></div></nav><main class="container forgot-wrap"><section class="section"><h2>Forgot Password?</h2><p class="muted">Enter your registered email address. We will send a verification code.</p><div id="msg" class="msg"></div><div id="step1" class="step show"><label for="email">Email Address</label><input id="email" type="email" placeholder="you@example.com"><button id="sendBtn" class="btn" style="margin-top:14px;width:100%">Send Reset Code</button></div><div id="step2" class="step"><label for="code">Verification Code</label><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><label for="newPassword" style="margin-top:14px;display:block">New Password</label><div class="password-wrap" style="position:relative"><input id="newPassword" type="password" placeholder="At least 8 characters" style="width:100%;padding-right:48px"><button id="eye" type="button" style="position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:#eef4fb;border-radius:7px;padding:8px;cursor:pointer">👁</button></div><button id="resetBtn" class="btn" style="margin-top:14px;width:100%">Reset Password</button></div></section></main><script>
let resetId=null;const msg=document.getElementById('msg');function show(type,t){msg.className='msg '+type;msg.textContent=t}async function api(path,body){const r=await fetch(window.location.origin+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.message||'Request failed');return d}
document.getElementById('sendBtn').onclick=async()=>{msg.className='msg';try{const d=await api('/api/auth/forgot-password',{email:document.getElementById('email').value.trim()});resetId=d.resetId;document.getElementById('step1').classList.remove('show');document.getElementById('step2').classList.add('show');show('ok','A reset code has been sent to your email.')}catch(e){show('err',e.message)}};document.getElementById('resetBtn').onclick=async()=>{try{const d=await api('/api/auth/reset-password',{resetId,code:document.getElementById('code').value.trim(),newPassword:document.getElementById('newPassword').value});show('ok','Password reset successfully. You can now log in.');setTimeout(()=>location.href='login.html',900)}catch(e){show('err',e.message)}};document.getElementById('eye').onclick=()=>{const i=document.getElementById('newPassword');i.type=i.type==='password'?'text':'password'};
</script></body></html>
