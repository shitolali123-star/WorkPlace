<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch Video — Work Place</title><link rel="stylesheet" href="style.css"></head><body class="ent-page"><nav class="navbar"><a class="logo" href="entertainment.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a><div class="navlinks"><a href="entertainment.html">Entertainment</a><a href="coins.html" class="coin-nav"><img src="assets/work-place-coin-logo.png" alt="Coin"></a></div><div class="user-area"><span class="user-name">User</span></div></nav><main class="watch-shell"><section class="watch-main"><div class="player-wrap"><video id="watchVideo" controls playsinline preload="metadata" poster=""><source id="watchSource" src="" type="video/mp4"></video><div id="demoPlayer" class="demo-player"><span>▶</span><p>Video preview</p><small>Connect this video to your approved media storage.</small></div></div><div class="watch-title"><span id="videoType" class="status-pill"></span><h1 id="videoTitle"></h1><p id="videoMeta" class="creator-line"></p><p id="videoDesc"></p></div><div class="watch-actions"><button onclick="toggleLike()">👍 Like <b id="likeCount">0</b></button><button onclick="focusComment()">💬 Comment</button><button onclick="toggleSave()">🔖 Save</button><button onclick="shareVideo()">↗ Share</button><button class="danger" onclick="reportVideo()">⚑ Report</button></div><section class="comments panel"><h2>Comments</h2><textarea id="commentBox" placeholder="Write a comment…"></textarea><button class="btn" onclick="addComment()">Post Comment</button><div id="comments"></div></section></section><aside class="watch-side"><div class="section"><h3>Sponsored</h3><div class="watch-ad">Advertisement</div></div><div class="section"><h3>Recommended</h3><div id="recommendations" class="recommend-list"></div></div></aside></main><script src="script.js"></script><script>
const videos=[{id:1,title:'How to Learn Electrician Work',type:'Teaching',creator:'Work Place Academy',views:12800,likes:920,desc:'Practical electrician skills and safe wiring basics.'},{id:2,title:'Creative Design Short Tips',type:'Shorts',creator:'Design Hub',views:8900,likes:670,desc:'Quick graphic design tips for everyday work.'},{id:3,title:'Online Work Skills — Full Course',type:'Long Videos',creator:'Skill Builder',views:23100,likes:1540,desc:'Build useful online work skills from beginner to advanced.'},{id:4,title:'Creator Live Session',type:'Live',creator:'Creator Studio',views:5200,likes:410,desc:'Live community session from Work Place creators.'},{id:5,title:'Trending Work Place Story',type:'Trending',creator:'Community TV',views:18000,likes:1330,desc:'A trending story from the Work Place community.'}];
const id=Number(new URLSearchParams(location.search).get('id')||1);const v=videos.find(x=>x.id===id)||videos[0];
function arr(k){try{return JSON.parse(localStorage.getItem('wp_'+k)||'[]')}catch{return[]}}function saveArr(k,a){localStorage.setItem('wp_'+k,JSON.stringify(a))}
videoTitle.textContent=v.title;videoType.textContent=v.type;videoMeta.textContent=`${v.creator} · 👁 ${v.views.toLocaleString()} views`;videoDesc.textContent=v.desc;likeCount.textContent=v.likes;
let liked=arr('liked').includes(v.id),saved=arr('saved').includes(v.id);
function toggleLike(){let a=arr('liked');liked=!a.includes(v.id);a=liked?a.concat(v.id):a.filter(x=>x!==v.id);saveArr('liked',a);likeCount.textContent=v.likes+(liked?1:0)}
function toggleSave(){let a=arr('saved');saved=!a.includes(v.id);a=saved?a.concat(v.id):a.filter(x=>x!==v.id);saveArr('saved',a);alert(saved?'Saved':'Removed from Saved')}
function shareVideo(){if(navigator.share)navigator.share({title:v.title,url:location.href});else navigator.clipboard?.writeText(location.href).then(()=>alert('Video link copied.'))}
function reportVideo(){const reason=prompt('Why are you reporting this video?');if(reason)alert('Report submitted for admin review.')}
function focusComment(){commentBox.focus()}
function addComment(){const text=commentBox.value.trim();if(!text)return;const a=arr('comments_'+v.id);a.push({text,at:new Date().toISOString()});saveArr('comments_'+v.id,a);commentBox.value='';renderComments()}
function renderComments(){comments.innerHTML=arr('comments_'+v.id).map(c=>`<div class="comment-item">${c.text}</div>`).join('')||'<p class="muted">No comments yet.</p>'} 
const h=arr('history').filter(x=>x!==v.id);h.unshift(v.id);saveArr('history',h.slice(0,100));
recommendations.innerHTML=videos.filter(x=>x.id!==v.id).slice(0,4).map(x=>`<a href="video.html?id=${x.id}" class="recommend-item"><div class="recommend-thumb">▶</div><div><b>${x.title}</b><small>${x.creator} · ${x.views.toLocaleString()} views</small></div></a>`).join('');renderComments();
const player=document.getElementById('watchVideo');let active=false,watchSeconds=0;player.addEventListener('play',()=>active=true);player.addEventListener('pause',()=>active=false);player.addEventListener('ended',()=>active=false);setInterval(()=>{if(!active)return;watchSeconds++;const rate=Math.max(1,Number(getCoinSettings().activeSeconds||10));if(watchSeconds%rate===0)addCoins(1)},1000);
</script></body></html>
