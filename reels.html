<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reels — Work Place</title><link rel="stylesheet" href="style.css"></head><body class="ent-page reels-page"><nav class="navbar"><a class="logo" href="entertainment.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a><div class="navlinks"><a href="entertainment.html">Entertainment</a><a href="coins.html" class="coin-nav"><img src="assets/work-place-coin-logo.png" alt="Coin"></a></div><div class="user-area"><span class="user-name">User</span></div></nav><main class="reels-shell"><aside class="ent-sidebar section"><h3>Entertainment</h3><a href="entertainment.html">🏠 <span>For You</span></a><a href="#">👥 <span>Following</span></a><a href="#">📱 <span>Shorts</span></a><a href="#">🎞️ <span>Long Videos</span></a><a class="active" href="reels.html">🎬 <span>Reels</span></a><a href="#">🔴 <span>Live</span></a><a href="#">🔥 <span>Trending</span></a><a href="#">📚 <span>Teaching</span></a><a href="#">🔖 <span>Saved Videos</span></a><a href="#">❤️ <span>Liked Videos</span></a><a href="#">🕘 <span>History</span></a><a href="channel.html">🎬 <span>Your Channel</span></a></aside><section class="reels-feed" id="reelsFeed"></section></main><script src="script.js"></script><script>
const reels=[{id:101,title:'Quick Electrician Tip',creator:'Work Place Academy',likes:920,comments:88,src:''},{id:102,title:'Design Tip in 30 Seconds',creator:'Design Hub',likes:670,comments:64,src:''},{id:103,title:'Easy Online Work Tip',creator:'Skill Builder',likes:1540,comments:120,src:''}];
function reelCard(r){return `<article class="reel-card"><div class="reel-ad">Advertisement</div><div class="reel-video-wrap"><video class="reel-video" playsinline muted loop preload="metadata"><source src="${r.src}" type="video/mp4"></video><div class="reel-placeholder">▶<small>Reel preview</small></div><button class="reel-fullscreen" title="Full screen" onclick="fullReel(this)">⛶</button><div class="reel-actions"><button>👍<span>${r.likes}</span></button><button>💬<span>${r.comments}</span></button><button>🔖</button><button>↗</button><button>⚑</button></div></div><div class="reel-info"><b>${r.title}</b><small>${r.creator}</small></div></article>`}
reelsFeed.innerHTML=reels.map(reelCard).join('');const cards=[...document.querySelectorAll('.reel-card')];const obs=new IntersectionObserver(entries=>entries.forEach(e=>{const video=e.target.querySelector('.reel-video');if(e.isIntersecting){video.play().catch(()=>{});e.target.classList.add('playing')}else{video.pause();e.target.classList.remove('playing')}}),{threshold:.72});cards.forEach(c=>obs.observe(c));
function fullReel(btn){const v=btn.closest('.reel-video-wrap').querySelector('video');if(v.requestFullscreen)v.requestFullscreen();else if(v.webkitEnterFullscreen)v.webkitEnterFullscreen()}
let sec=0;setInterval(()=>{const active=document.querySelector('.reel-card.playing');if(!active)return;sec++;const rate=Math.max(1,Number(getCoinSettings().activeSeconds||10));if(sec%rate===0)addCoins(1)},1000);
</script></body></html>
