<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Channel - Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a><div class="navlinks"><a href="entertainment.html">Entertainment</a><a href="upload-video.html">Post Video</a></div></nav><main class="container"><section class="channel-hero"><img id="channelPhoto" class="channel-avatar" src="assets/work-place-logo.png"><div><h1 id="channelName">Your Channel</h1><p id="channelEmail">Automatic channel from your Work Place account</p><p>Customize your channel information any time.</p><a class="btn btn-light" href="profile.html">Edit Channel Information</a></div></section><section class="channel-stats"><div class="stat"><span>Videos</span><b id="videoCount">0</b></div><div class="stat"><span>Total Views</span><b id="viewCount">0</b></div><div class="stat"><span>Likes</span><b id="likeCount">0</b></div><div class="stat"><span>Reports</span><b id="reportCount">0</b></div><div class="stat"><span>Eligible Earnings</span><b id="earnCount">৳0</b></div></section><section class="section"><h2>Creator Monetisation</h2><p id="monStatus">Not applied</p><a class="btn btn-green" href="monetization.html">Apply for Monetisation</a></section><section class="section"><h2>Channel Content</h2><div id="myVideos" class="creator-grid"></div></section></main><script src="script.js"></script><script>const u=getUser()||{};channelName.textContent=(u.channelName||u.name||'Your')+' Channel';channelEmail.textContent=u.email||'Email will be linked automatically';if(u.photo_data)channelPhoto.src=u.photo_data;const vids=JSON.parse(localStorage.getItem('wp_uploadedVideos')||'[]');videoCount.textContent=vids.length;viewCount.textContent=vids.reduce((a,v)=>a+Number(v.views||0),0);likeCount.textContent=vids.reduce((a,v)=>a+Number(v.likes||0),0);const apps=JSON.parse(localStorage.getItem('wp_monetizationApps')||'[]');const app=apps.find(a=>a.email===u.email);monStatus.textContent=app?`Status: ${app.status}${app.target?' · Target: '+app.target:''}`:'Not applied';myVideos.innerHTML=vids.length?vids.map(v=>`<article class="video-card"><div class="video-thumb">▶</div><span class="status-pill">${v.type}</span><h3>${v.title}</h3><p class="muted">${v.visibility} · ${v.monetization}</p></article>`).join(''):'No videos posted yet.';</script></body></html>
