<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monetisation Application - Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a></nav><main class="container"><section class="section"><h1>Creator Monetisation Application</h1><div class="danger-note"><b>Private verification information:</b> NID/government ID and bank details must never be shown publicly on the channel. This prototype stores only application metadata locally; production deployment should encrypt and store sensitive documents server-side.</div><form id="monForm" class="form-grid"><div class="field"><label>Full Legal Name</label><input name="name" required></div><div class="field"><label>Government ID / NID Number</label><input name="nid" required></div><div class="field"><label>Government ID Document</label><input name="idDoc" type="file" accept="image/*,.pdf" required></div><div class="field"><label>Bank / Payout Method</label><input name="bank" required placeholder="Bank name or supported payout method"></div><div class="field"><label>Account Holder Name</label><input name="holder" required></div><div class="field"><label>Account Number</label><input name="account" required></div><div class="field full"><label>Why should your channel be monetised?</label><textarea name="note"></textarea></div><div class="field full"><button class="btn btn-green">Submit for Admin Review</button></div></form></section></main><script src="script.js"></script><script>monForm.onsubmit=e=>{e.preventDefault();if(!requireLogin())return;const u=getUser(),f=e.target,doc=f.idDoc.files[0];if(doc.size>10*1024*1024){alert('Verification document must be 10 MB or smaller.');return}const a=JSON.parse(localStorage.getItem('wp_monetizationApps')||'[]').filter(x=>x.email!==u.email);a.push({email:u.email,channel:u.channelName||u.name,status:'Pending Review',submittedAt:new Date().toISOString(),target:'',legalName:f.name.value,nidMasked:'••••'+f.nid.value.slice(-4),bank:f.bank.value,holder:f.holder.value,accountMasked:'••••'+f.account.value.slice(-4),documentName:doc.name});localStorage.setItem('wp_monetizationApps',JSON.stringify(a));alert('Application submitted. Admin can Approve, Reject, or Set a Target.');location.href='channel.html'}</script></body></html>
