<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Profile - Work Place</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav class="navbar"><a class="logo" href="index.html"><span>W</span> Work Place</a><div class="navlinks"><a href="index.html">Dashboard</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a></div><div class="user-area"><span class="user-name">User</span></div></nav>
<main class="container"><section class="section"><h2>My Profile</h2><div class="notice">Every Work Place account has a profile photo.</div><div id="profileBox"></div></section></main>
<footer class="footer"><h2>Work Place</h2><p>Find Work. Post Work. Get Things Done.</p></footer>
<script src="script.js"></script><script>
const API_BASE=window.location.origin;
function photoBlock(u){return u.photoData?`<img class="profile-photo" src="${u.photoData}" alt="Profile photo">`:`<div class="profile-photo" style="display:grid;place-items:center;font-size:44px">📷</div>`}
async function loadProfile(){const box=document.getElementById("profileBox"),u=getUser();if(!u){box.innerHTML='<p>You are not logged in.</p><a class="btn" href="login.html">Login / Sign Up</a>';return}try{const r=await fetch(API_BASE+"/api/profile/"+encodeURIComponent(u.id));const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||"Could not load profile");setUser({...u,photoData:d.user.photoData});renderProfile(d.user)}catch(e){renderProfile(u);}}
function renderProfile(u){const box=document.getElementById("profileBox");box.innerHTML=`<div class="profile-photo-wrap">${photoBlock(u)}<div><h3 style="margin:0 0 8px">${escapeHtml(u.name)}</h3><div class="photo-help">JPG, PNG or WebP · smaller than 2 MB</div><input id="changePhoto" type="file" accept="image/jpeg,image/png,image/webp" style="margin-top:12px"><div id="photoMsg" class="photo-help" style="margin-top:8px"></div></div></div><p><b>Name:</b> ${escapeHtml(u.name)}</p><p><b>Email:</b> ${escapeHtml(u.email)}</p><p><b>Phone:</b> ${escapeHtml(u.phone||"")}</p><p><b>Account Type:</b> ${escapeHtml(u.type||"")}</p><p><b>Email Verification:</b> ${escapeHtml(u.verification?.email||"Verified")}</p><p><b>Identity Status:</b> ${escapeHtml(u.verification?.identity||"Pending")}</p><button class="btn btn-red" onclick="localStorage.removeItem('workPlaceUser');location.href='login.html'">Logout</button>`;document.getElementById("changePhoto").addEventListener("change",updatePhoto)}
function resizePhoto(file){return new Promise((resolve,reject)=>{if(!["image/jpeg","image/png","image/webp"].includes(file.type))return reject(new Error("Please choose a JPG, PNG, or WebP photo."));if(file.size>2*1024*1024)return reject(new Error("Please choose a photo smaller than 2 MB."));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.82))};img.onerror=()=>reject(new Error("Could not read the photo."));img.src=r.result};r.onerror=()=>reject(new Error("Could not read the photo."));r.readAsDataURL(file)})}
async function updatePhoto(e){const f=e.target.files?.[0],msg=document.getElementById("photoMsg"),u=getUser();if(!f)return;msg.textContent="Uploading...";try{const data=await resizePhoto(f);const r=await fetch(API_BASE+"/api/profile/photo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({userId:u.id,photoData:data})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||"Upload failed");setUser({...u,photoData:d.photoData});msg.textContent="✓ Profile photo updated.";renderProfile(getUser())}catch(err){msg.textContent=err.message;e.target.value=""}}
loadProfile();
</script></body></html>
