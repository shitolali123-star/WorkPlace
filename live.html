<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go Live — Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" alt="Work Place" class="brand-logo"></a><div class="navlinks"><a href="index.html">Home</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a><a href="entertainment.html">Entertainment</a><a href="advertisement.html">Advertisement</a><a href="payments.html">Payments</a><a href="appeal-history.html">Appeals</a><a href="messaging.html" class="message-nav">💬</a><a class="coin-nav" href="coins.html"><img src="assets/work-place-coin-logo.png" alt="Coins" style="width:24px;height:24px"></a></div><div class="user-area"><a class="profile-icon-link" href="profile.html">👤</a></div></nav><main class="container"><section class="section"><h1 id="liveHeading">🔴 Go Live</h1><p class="muted">Choose a category and start your live room. This version provides the live-room interface; real multi-user broadcasting needs a production streaming service/WebRTC infrastructure.</p><div class="grid2"><div><div class="field"><label>Live Title</label><input id="liveTitle" placeholder="What are you going live about?" required></div><div class="field"><label>Category</label><select id="liveCategory"><option>Gaming</option><option>News</option><option>Movie</option><option>Natok</option><option>Entertainment</option><option>Sports</option><option>Technology</option><option>Education</option><option>Music</option><option>Comedy</option><option>Industrial</option><option>Agriculture</option><option>Jobs &amp; Skills</option><option>Health</option><option>Business</option></select></div><div class="field"><label>Description</label><textarea id="liveDescription"></textarea></div><button class="btn" id="startLive">🔴 Start Live</button> <button class="btn btn-light" id="stopLive" style="display:none">Stop Live</button></div><div><video id="camera" autoplay muted playsinline style="width:100%;max-height:420px;background:#111827;border-radius:14px"></video><div id="liveStatus" class="notice" style="margin-top:10px">Camera preview is off.</div></div></div></section></main><script src="script.js"></script><script>let stream=null;let liveId=null;const camera=document.getElementById('camera');const status=document.getElementById('liveStatus');const start=document.getElementById('startLive'),stop=document.getElementById('stopLive');async function startLiveNow(){if(!requireLogin())return;try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});camera.srcObject=stream}catch(e){alert('Camera/microphone permission is required to start a live room.');return}liveId=Date.now();const data={id:liveId,title:document.getElementById('liveTitle').value.trim()||'Work Place Live',category:document.getElementById('liveCategory').value,description:document.getElementById('liveDescription').value.trim(),creator:'Work Place Creator',active:true,startedAt:new Date().toISOString(),viewers:0};const a=JSON.parse(localStorage.getItem('wp_liveStreams')||'[]');a.unshift(data);localStorage.setItem('wp_liveStreams',JSON.stringify(a));status.textContent='🔴 You are live now. Keep this page open while streaming.';start.style.display='none';stop.style.display='inline-block'}function stopLiveNow(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;camera.srcObject=null;const a=JSON.parse(localStorage.getItem('wp_liveStreams')||'[]');const i=a.findIndex(x=>x.id===liveId);if(i>=0){a[i].active=false;localStorage.setItem('wp_liveStreams',JSON.stringify(a))}status.textContent='Live ended.';start.style.display='inline-block';stop.style.display='none'}start.onclick=startLiveNow;stop.onclick=stopLiveNow;const viewId=new URLSearchParams(location.search).get('view');if(viewId){const a=JSON.parse(localStorage.getItem('wp_liveStreams')||'[]');const x=a.find(v=>String(v.id)===String(viewId));if(x){document.getElementById('liveHeading').textContent='🔴 '+x.title;status.textContent='Viewing live room · '+x.category;start.style.display='none';stop.style.display='none'}}</script></body></html>
