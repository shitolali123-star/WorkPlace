<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messaging — Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a><div class="navlinks"><a href="index.html">Dashboard</a><a href="entertainment.html">Entertainment</a><a href="coins.html" class="coin-nav"><img src="assets/work-place-coin-logo.png" alt="Coin"></a></div><div class="user-area"><span class="user-name">User</span></div></nav><main class="container"><section class="section"><h1>💬 Messaging</h1><p class="muted">Message workers and job clients in one place.</p><div class="message-layout"><aside class="conversation-list"><div class="conversation active"><b>Work Place Support</b><small>How can we help?</small></div><div class="conversation"><b>Previous Worker</b><small>Job conversation</small></div></aside><section class="chat-panel"><div id="chatMessages" class="chat-messages"><div class="chat-bubble other">Hello! How can I help you?</div></div><form onsubmit="sendMessage(event)" class="chat-compose"><input id="messageInput" placeholder="Write a message…"><button class="btn">Send</button></form></section></div></section></main><script>function sendMessage(e){e.preventDefault();const i=document.getElementById('messageInput');const t=i.value.trim();if(!t)return;const d=document.createElement('div');d.className='chat-bubble me';d.textContent=t;document.getElementById('chatMessages').appendChild(d);i.value='';d.scrollIntoView({behavior:'smooth'})}</script></body></html>
