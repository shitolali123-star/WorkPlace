<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Work Place Profile</title><link rel="stylesheet" href="style.css"><style>
.profile-shell{max-width:1000px;margin:35px auto}.profile-hero{display:flex;gap:22px;align-items:center;padding:26px;border-radius:18px;background:linear-gradient(135deg,#fff,#f4f7fb);border:1px solid #dfe7f1;box-shadow:0 12px 30px rgba(30,50,80,.08)}
.profile-photo-lg{width:105px;height:105px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 5px 18px rgba(0,0,0,.12);background:#edf2f7;display:grid;place-items:center;font-size:44px}
.profile-id{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#eef4ff;color:#254b86;font-weight:800;letter-spacing:1px;margin-top:7px}
.profile-section{margin-top:22px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.section-title h2{margin:0}.stats-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat-box{background:#fff;border:1px solid #e1e8f0;border-radius:14px;padding:16px;text-align:center}.stat-box b{display:block;font-size:25px;margin-top:5px}.stat-box span{font-size:12px;color:#6b7280}.public-job-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.public-job-card{background:#fff;border:1px solid #dfe7f1;border-radius:16px;padding:18px;box-shadow:0 7px 18px rgba(30,50,80,.06)}.job-card-head{display:flex;justify-content:space-between;gap:10px}.status-pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}.status-pill.available{background:#e9f8ef;color:#157347}.status-pill.waiting{background:#fff4dc;color:#9a6500}.status-pill.confirmed{background:#e8f0ff;color:#2454a6}.price-lg{font-size:24px;font-weight:900;margin:12px 0}.muted{color:#6b7280}.pending-card{border:1px solid #f0d38a;background:#fffaf0}.pending-actions{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}.btn-success{background:#16834b;color:#fff}.btn-danger{background:#c93c3c;color:#fff}.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info-item{padding:13px 15px;border:1px solid #e3e9f0;border-radius:12px;background:#fff}.info-item b{display:block;font-size:12px;color:#6b7280;margin-bottom:4px}.empty-box{padding:25px;text-align:center;border:1px dashed #cbd5e1;border-radius:14px;color:#64748b;background:#fafcff}@media(max-width:760px){.stats-grid{grid-template-columns:repeat(2,1fr)}.public-job-grid,.info-grid{grid-template-columns:1fr}.profile-hero{align-items:flex-start;flex-direction:column}}
.review-summary{display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:stretch}.review-score{background:#f7fbff;border:1px solid #dbe8f5;border-radius:14px;padding:18px;text-align:center}.review-score strong{font-size:34px;display:block}.review-form{display:grid;gap:10px}.review-form textarea{min-height:100px;resize:vertical}.review-form input,.review-form select,.review-form textarea{width:100%;padding:11px;border:1px solid #dbe3ef;border-radius:9px;background:#fff}.review-list{display:grid;gap:10px;margin-top:14px}.review-item{border:1px solid #e2e8f0;border-radius:12px;padding:13px;background:#fff}.review-meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.review-proof{max-width:180px;max-height:130px;object-fit:cover;border-radius:8px;margin-top:8px}@media(max-width:760px){.review-summary{grid-template-columns:1fr}}</style><style>.profile-action{border:1px solid #dbe3ef;background:#fff;color:#24324a;border-radius:9px;padding:7px 11px;font-weight:700;cursor:pointer}.profile-action:hover{background:#f4f7fb}.role-summary{background:#f7f5ff;border:1px solid #e8defe;border-radius:10px;padding:12px}</style>
</head>
<body>
<nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" alt="Work Place" class="brand-logo"></a><div class="navlinks"><a href="index.html">Home</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a><a href="entertainment.html">Entertainment</a><a href="advertisement.html">Advertisement</a><a href="payments.html">Payments</a><a href="appeal-history.html">Appeals</a><a href="messaging.html" class="message-nav" title="Messaging">💬</a><a class="coin-nav" href="coins.html" title="Coins & Rewards"><img src="assets/work-place-coin-logo.png" alt="Coins" style="width:24px;height:24px;vertical-align:middle"></a><div class="notification-wrap"><button class="notification-button" type="button" aria-label="Notifications" title="Notifications">🔔<span class="notification-count" style="display:none">0</span></button><div class="notification-panel"><div class="notification-head"><b>Notifications</b><button type="button" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="notification-list"><div class="notification-empty">Loading…</div></div></div></div></div><div class="user-area"><a class="profile-icon-link" href="profile.html" title="Profile" aria-label="Profile">👤</a><a class="btn login-link" href="login.html">Login / Sign Up</a></div></nav>
<main class="container"><section class="profile-shell"><div id="publicProfile"></div></section></main>
<footer class="footer"><h2>Work Place</h2><p>Find Work. Post Work. Get Things Done.</p></footer>
<script src="script.js"></script><script>
async function addFriendFromProfile(profileId,targetUserId){const meNow=getUser();if(!profileId||profileId==='Not assigned'){alert('This profile does not have a Work Place ID yet.');return}if(!meNow){alert('Please Login / Sign Up first.');location.href='login.html';return}if(!targetUserId){alert('Friend request is available for registered profiles.');return}try{const r=await fetch('/api/messaging/friend-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({me:meNow.id,target:targetUserId})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Could not send friend request.');alert('Friend request sent to Work Place ID '+profileId+'.');}catch(e){alert(e.message)}}
function messageFromProfile(id){if(!id){alert('This profile is unavailable.');return}location.href='messaging.html?profileId='+encodeURIComponent(id);}
async function shareProfileFromPage(id,name){if(!id){alert('This profile is unavailable.');return}const link=location.origin+'/public-profile.html?profileId='+encodeURIComponent(id);try{await navigator.clipboard.writeText(link);alert('Profile link copied for '+name+'!');}catch(e){prompt('Copy this profile link:',link);}}
</script><script>
const demoWorkers={
 'Abdul Karim':{profession:'Electrician',rating:'4.9',jobs:25,location:'Rajshahi',profileId:'10000001'},
 'Rahim Ahmed':{profession:'Cleaner',rating:'4.7',jobs:18,location:'Dhaka',profileId:'10000002'},
 'Sakib Hasan':{profession:'Delivery Worker',rating:'4.8',jobs:31,location:'Chattogram',profileId:'10000003'},
 'Nayeem Islam':{profession:'Gardener',rating:'4.6',jobs:14,location:'Rajshahi',profileId:'10000004'},
 'Jahid Hasan':{profession:'Photographer',rating:'4.9',jobs:22,location:'Dhaka',profileId:'10000005'},
 'Karim Mia':{profession:'Plumber',rating:'4.5',jobs:12,location:'Narayanganj',profileId:'10000006'}
};
const params=new URLSearchParams(location.search);const profileId=params.get('profileId')||'';const name=params.get('name')||'';const box=document.getElementById('publicProfile');const me=getUser();
function esc(v){return escapeHtml(v??'')}
function photoHtml(src){return src?`<img class="profile-photo-lg" src="${src}" alt="Profile photo">`:`<div class="profile-photo-lg">👤</div>`}
function localClientData(displayName){
 const jobs=getJobs().filter(j=>String(j.postedBy||'')===String(displayName));
 return {user:{id:null,profileId:jobs[0]?.posterProfileId||'',name:displayName,type:'client',photoData:jobs[0]?.posterPhoto||'',profession:'Job Poster',location:jobs[0]?.location||'',country:'',availability:''},stats:{posted:jobs.length,completed:jobs.filter(j=>j.status==='Completed').length,inProgress:jobs.filter(j=>['Confirmed','In Progress'].includes(j.status)).length,pending:jobs.filter(j=>['Posted','Pending Client Confirmation','Accepted'].includes(j.status)).length,cancelled:jobs.filter(j=>['Cancelled','Expired','Uncompleted'].includes(j.status)).length},postedJobs:jobs.filter(j=>['Posted','Pending'].includes(j.status))};
}
function render(data){
 dataTargetId=(data.user||{}).id||null;
 const u=data.user||{}; const stats=data.stats||{}; const jobs=data.postedJobs||[]; const isMe=me && ((u.id&&Number(me.id)===Number(u.id)) || (u.profileId&&String(me.profileId)===String(u.profileId)) || (!u.id&&name&&String(me.name)===String(name)));
 const pending= isMe && u.type!=='worker' ? getJobs().filter(j=>Number(j.posterId)===Number(me.id)&&String(j.status)==='Pending Client Confirmation'&&j.acceptedWorkerId) : [];
 box.innerHTML=`<div class="profile-hero">${photoHtml(u.photoData)}<div style="flex:1"><div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><h1 style="margin:0">${esc(u.name)}</h1><button class="profile-action" onclick="addFriendFromProfile('${esc(u.profileId||'')}',${Number(u.id||0)})">➕ Add Friend</button><button class="profile-action" onclick="messageFromProfile('${esc(u.profileId||'')}')">💬 Message</button><button class="profile-action" onclick="shareProfileFromPage('${esc(u.profileId||'')}','${esc(u.name||'')}')">🔗 Share</button></div><div class="muted" style="margin-top:6px">${esc(u.profession||u.type||'Work Place User')}</div><div class="profile-id">Work Place ID: ${esc(u.profileId||'Not assigned')}</div></div></div>
 <div class="profile-section"><div class="section-title"><h2>📊 Current Situation</h2></div><div class="stats-grid"><div class="stat-box"><span>Posted Jobs</span><b>${Number(stats.posted||0)}</b></div><div class="stat-box"><span>Completed</span><b>${Number(stats.completed||0)}</b></div><div class="stat-box"><span>In Progress</span><b>${Number(stats.inProgress||0)}</b></div><div class="stat-box"><span>Pending</span><b>${Number(stats.pending||0)}</b></div><div class="stat-box"><span>Cancelled / Other</span><b>${Number(stats.cancelled||0)}</b></div></div></div>
 <div class="profile-section"><div class="section-title"><h2>📋 Present Posted Jobs</h2><span class="muted">${jobs.length} available</span></div><div class="public-job-grid">${jobs.length?jobs.map(j=>`<div class="public-job-card"><div class="job-card-head"><div><h3 style="margin:0 0 5px">${esc(j.title)}</h3><div class="muted">${esc(j.category)}</div></div><span class="status-pill available">Available</span></div><p>${esc(j.description)}</p><div class="price-lg">৳${esc(j.price)}</div><div class="muted">📍 ${esc(j.location)} · ⏰ ${esc(j.deadline)}</div><button class="btn btn-purple" style="margin-top:14px" onclick="acceptFromProfile(${Number(j.id)})">Accept Job →</button></div>`).join(''):'<div class="empty-box" style="grid-column:1/-1">There are no currently available posted jobs.</div>'}</div></div>
 ${pending.length?`<div class="profile-section"><div class="section-title"><h2>🔔 Workers Waiting for Confirmation</h2></div><div class="public-job-grid">${pending.map(j=>`<div class="public-job-card pending-card"><div class="job-card-head"><div><h3 style="margin:0 0 5px">${esc(j.title)}</h3><div class="muted">Worker: ${esc(j.acceptedBy||'Worker')}${j.acceptedWorkerProfileId?` · ID: ${esc(j.acceptedWorkerProfileId)}`:''}</div></div><span class="status-pill waiting">Your Confirmation</span></div><div class="price-lg">৳${esc(j.price)}</div><div class="muted">${esc(j.location)} · ${esc(j.deadline)}</div><div class="pending-actions"><button class="btn btn-success" onclick="confirmWorker(${Number(j.id)})">✅ Confirm Worker</button><button class="btn btn-danger" onclick="rejectWorker(${Number(j.id)})">❌ Reject</button><button class="btn btn-light" onclick="openWorkerProfile('${esc(j.acceptedWorkerProfileId||'')}','${esc(j.acceptedBy||'')}')">View Worker Profile</button></div></div>`).join('')}</div></div>`:''}
 <div class="profile-section"><div class="section-title"><h2>ℹ️ Public Information</h2></div><div class="info-grid"><div class="info-item"><b>Profession</b>${esc(u.profession||'Not provided')}</div><div class="info-item"><b>Sector</b>${esc(u.sector||'Not provided')}</div><div class="info-item"><b>Location</b>${esc(u.location||'Not provided')}</div><div class="info-item"><b>Availability</b>${esc(u.availability||'Not provided')}</div><div class="info-item"><b>Rating</b>⭐ ${esc(u.rating||'New')}</div><div class="info-item"><b>Account Type</b>${esc(u.type||'User')}</div></div></div>
 <div class="profile-section"><div class="section-title"><h2>⭐ Comments & Reviews</h2><span class="muted" id="reviewCount">0 reviews</span></div><div class="review-summary"><div class="review-score"><span class="muted">Overall Rating</span><strong id="reviewAverage">—</strong><span>⭐</span></div><div><div class="notice">Reviews are available for completed jobs connected to this profile. One review is allowed per completed job, with one optional proof photo.</div><form id="reviewForm" class="review-form" onsubmit="submitProfileReview(event)"><div class="formgrid"><div><label>Completed Job</label><select id="reviewJob" required><option value="">Select completed job</option></select></div><div><label>Rating</label><select id="reviewRating" required><option value="">Select rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></div></div><textarea id="reviewComment" maxlength="1000" placeholder="Write a fair comment about the completed job…" required></textarea><div><label>Proof Photo (optional)</label><input id="reviewProof" type="file" accept="image/jpeg,image/png,image/webp"></div><button class="btn btn-purple" type="submit">Submit Review</button></form></div></div><div id="reviewList" class="review-list"></div></div></div> <div style="margin-top:22px"><button class="btn btn-light" onclick="history.back()">← Back</button></div>`;
 loadProfileReviews(u.profileId||profileId,u.id||null);
}

async function loadProfileReviews(targetProfileId,targetUserId){
 const list=document.getElementById('reviewList'); if(!list||!targetProfileId)return;
 try{const r=await fetch('/api/public-profile/'+encodeURIComponent(targetProfileId)+'/reviews');const d=await r.json();if(r.ok&&d.ok){document.getElementById('reviewCount').textContent=(d.summary.count||0)+' review'+(d.summary.count===1?'':'s');document.getElementById('reviewAverage').textContent=d.summary.count?Number(d.summary.average).toFixed(1):'—';list.innerHTML=d.reviews.length?d.reviews.map(x=>`<div class="review-item"><div class="review-meta"><b>${esc(x.reviewer_name||'Work Place User')}</b><span>⭐ ${Number(x.rating)}/5</span></div><p>${esc(x.comment)}</p><small class="muted">${esc(x.created_at||'')}</small>${x.proof_data?`<div><img class="review-proof" src="${esc(x.proof_data)}" alt="Review proof"></div>`:''}</div>`).join(''):'<div class="empty-box">No reviews yet.</div>';}}catch(e){list.innerHTML='<div class="empty-box">Reviews are temporarily unavailable.</div>'}
 const form=document.getElementById('reviewForm'); if(!form)return;
 const meNow=getUser(); if(!meNow||Number(meNow.id)===Number(targetUserId)){form.style.display='none';return;}
 try{const jobs=getJobs();const completed=jobs.filter(j=>String(j.status)==='Completed' && ((Number(j.posterId)===Number(meNow.id)&&String(j.acceptedWorkerProfileId||'')===String(targetProfileId))||(Number(j.acceptedWorkerId)===Number(meNow.id)&&String(j.posterProfileId||'')===String(targetProfileId))));const sel=document.getElementById('reviewJob');sel.innerHTML='<option value="">Select completed job</option>'+completed.map(j=>`<option value="${Number(j.serverId||j.id)}">${esc(j.title)} — Job #${Number(j.serverId||j.id)}</option>`).join('');if(!completed.length){form.querySelectorAll('select,textarea,input,button').forEach(x=>x.disabled=true);form.style.opacity='.6';} }catch(e){form.querySelectorAll('select,textarea,input,button').forEach(x=>x.disabled=true);form.style.opacity='.6'}
}
async function submitProfileReview(e){e.preventDefault();const u=getUser();if(!u)return;const file=document.getElementById('reviewProof').files[0];let proof='';if(file){if(file.size>650*1024){alert('Proof photo must be smaller than 650 KB.');return}proof=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(file)});}const jobId=Number(document.getElementById('reviewJob').value),rating=Number(document.getElementById('reviewRating').value),comment=document.getElementById('reviewComment').value.trim();try{const r=await fetch('/api/public-profile/'+encodeURIComponent(profileId)+'/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reviewerId:u.id,jobId,rating,comment,proofData:proof})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Could not submit review.');alert('Review submitted successfully.');document.getElementById('reviewForm').reset();await loadProfileReviews(profileId,dataTargetId);}catch(err){alert(err.message)}}
let dataTargetId=null;
async function load(){
 try{
   if(profileId){const r=await fetch('/api/public-profile/'+encodeURIComponent(profileId));const d=await r.json();if(r.ok&&d.ok){render(d);return}}
 }catch(e){console.warn(e)}
 let display=name||me?.name||''; if(!display){box.innerHTML='<div class="empty-box">Profile not found.</div>';return}
 const demo=demoWorkers[display]; if(demo){render({user:{name:display,profileId:demo.profileId,type:'worker',profession:demo.profession,location:demo.location,rating:demo.rating},stats:{posted:0,completed:demo.jobs,inProgress:0,pending:0,cancelled:0},postedJobs:[]});return}
 render(localClientData(display));
}
async function acceptFromProfile(id){await takeJob(id);}
async function confirmWorker(id){if(!me)return;try{const r=await fetch('/api/jobs/'+id+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:me.id})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Confirmation failed');const jobs=getJobs(),j=jobs.find(x=>Number(x.id)===Number(id));if(j){j.status='Confirmed';saveJobs(jobs)}alert('Worker confirmed successfully.');await load();}catch(e){const jobs=getJobs(),j=jobs.find(x=>Number(x.id)===Number(id));if(j){j.status='Confirmed';saveJobs(jobs);alert('Worker confirmed in local prototype data.');await load()}else alert(e.message)}}
async function rejectWorker(id){if(!me)return;try{const r=await fetch('/api/jobs/'+id+'/reject-worker',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clientId:me.id})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.message||'Rejection failed');const jobs=getJobs(),j=jobs.find(x=>Number(x.id)===Number(id));if(j){j.status='Posted';j.acceptedWorkerId=null;j.acceptedBy=null;saveJobs(jobs)}alert('Worker rejected. The job is available again.');await load();}catch(e){const jobs=getJobs(),j=jobs.find(x=>Number(x.id)===Number(id));if(j){j.status='Posted';j.acceptedWorkerId=null;j.acceptedBy=null;saveJobs(jobs);alert('Worker rejected in local prototype data.');await load()}else alert(e.message)}}
function openWorkerProfile(id,n){if(id){location.href='public-profile.html?profileId='+encodeURIComponent(id)}else if(n){location.href='public-profile.html?name='+encodeURIComponent(n)}}
load();
</script></body></html>
