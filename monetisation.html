<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monetisation Application - Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo"></a></nav><main class="container"><div class="page-header"><h1>Creator Monetisation Application</h1><p>Submit identity and payout information for Admin review.</p></div><section class="section"><form id="mf" class="form-grid"><div class="field"><label>Legal name</label><input id="legal" required></div><div class="field"><label>Country</label><input id="country" required></div><div class="field"><label>Government ID / NID number</label><input id="nid" required></div><div class="field"><label>ID document</label><input id="idfile" type="file" accept="image/*,.pdf" required></div><div class="field"><label>Bank / payout provider</label><input id="bank" required></div><div class="field"><label>Account holder</label><input id="holder" required></div><div class="field"><label>Account number</label><input id="acct" required></div><div class="field full"><label>Declaration</label><textarea id="decl" required>I confirm that the information is accurate.</textarea></div><div class="field full"><button class="btn">Submit for Admin Review</button></div></form><p>Admin can Approve, Reject, or assign a target before monetisation is enabled.</p></section></main><script>mf.onsubmit=e=>{e.preventDefault();localStorage.setItem('wpMonetApplication',JSON.stringify({status:'Pending Review',submittedAt:new Date().toISOString(),legalName:legal.value,target:''}));alert('Application submitted for Admin review. Sensitive files/details must be stored server-side in production.');location.href='channel.html'}</script></body></html>
