<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monetisation Application - Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" alt="Work Place" class="brand-logo"></a><div class="navlinks"><a href="index.html">Home</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a><a href="entertainment.html">Entertainment</a><a href="advertisement.html">Advertisement</a><a href="payments.html">Payments</a><a href="appeal-history.html">Appeals</a><a href="messaging.html" class="message-nav" title="Messaging">💬</a><a class="coin-nav" href="coins.html" title="Coins & Rewards"><img src="assets/work-place-coin-logo.png" alt="Coins" style="width:24px;height:24px;vertical-align:middle"></a><div class="notification-wrap"><button class="notification-button" type="button" aria-label="Notifications" title="Notifications">🔔<span class="notification-count" style="display:none">0</span></button><div class="notification-panel"><div class="notification-head"><b>Notifications</b><button type="button" onclick="markAllNotificationsRead()">Mark all read</button></div><div class="notification-list"><div class="notification-empty">Loading…</div></div></div></div></div><div class="user-area"><a class="profile-icon-link" href="profile.html" title="Profile" aria-label="Profile">👤</a><a class="btn login-link" href="login.html">Login / Sign Up</a></div></nav><main class="container"><div class="page-header"><h1>Creator Monetisation Application</h1><p>Submit identity and payout information for Admin review.</p></div><section class="section"><form id="mf" class="form-grid"><div class="field"><label>Legal name</label><input id="legal" required></div><div class="field"><label>Country</label><input id="country" required></div><div class="field"><label>Government ID / NID number</label><input id="nid" required></div><div class="field"><label>ID document</label><input id="idfile" type="file" accept="image/*,.pdf" required></div><div class="field"><label>Bank / payout provider</label><input id="bank" required></div><div class="field"><label>Account holder</label><input id="holder" required></div><div class="field"><label>Account number</label><input id="acct" required></div><div class="field full"><label>Declaration</label><textarea id="decl" required>I confirm that the information is accurate.</textarea></div><div class="field full"><button class="btn">Submit for Admin Review</button></div></form><p>Admin can Approve, Reject, or assign a target before monetisation is enabled.</p></section></main><script>mf.onsubmit=e=>{e.preventDefault();localStorage.setItem('wpMonetApplication',JSON.stringify({status:'Pending Review',submittedAt:new Date().toISOString(),legalName:legal.value,target:''}));alert('Application submitted for Admin review. Sensitive files/details must be stored server-side in production.');location.href='channel.html'}</script></body></html>
