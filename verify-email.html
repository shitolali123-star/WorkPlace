<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify Email - Work Place</title><link rel="stylesheet" href="style.css"><style>.verify-wrap{max-width:560px;margin:50px auto}.verify-card{text-align:center}.otp-input{font-size:24px;letter-spacing:8px;text-align:center}.verify-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}.success{display:none;background:#ecfdf5;color:#166534;padding:12px;border-radius:10px;margin-top:15px;font-weight:700}.error{display:none;background:#fef2f2;color:#991b1b;padding:12px;border-radius:10px;margin-top:15px}.success.show,.error.show{display:block}</style></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a></nav><main class="container verify-wrap"><section class="section verify-card"><h2>Email Verification</h2><p>We sent a 6-digit verification code to <b id="emailText">your email address</b>.</p><p class="muted">The code is valid for 10 minutes. Your account will be created only after successful verification.</p><form id="verifyForm"><div class="field" style="max-width:340px;margin:20px auto"><label for="otp">Verification Code</label><input id="otp" class="otp-input" inputmode="numeric" maxlength="6" placeholder="000000" required></div><button class="btn" id="verifyBtn" type="submit">Verify Email & Create Account</button></form><div id="msgError" class="error"></div><div id="msgSuccess" class="success">✓ Email verified and account created successfully.</div><div class="verify-actions"><button class="btn btn-light" id="resendBtn" type="button">Resend Code</button><a class="btn btn-light" href="login.html">Back</a></div></section></main><script src="script.js"></script><script>
const qs=new URLSearchParams(location.search),challengeId=qs.get('challengeId')||sessionStorage.getItem('workPlaceSignupChallenge'),email=sessionStorage.getItem('workPlaceSignupEmail')||'';document.getElementById('emailText').textContent=email||'your email address';const otp=document.getElementById('otp'),verifyBtn=document.getElementById('verifyBtn'),resendBtn=document.getElementById('resendBtn'),err=document.getElementById('msgError'),ok=document.getElementById('msgSuccess');function msg(el,t){el.textContent=t;el.classList.add('show')}function clear(){err.classList.remove('show');ok.classList.remove('show')}async function api(path,body){const r=await fetch(window.location.origin+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||!d.ok)throw new Error(d.message||'Request failed');return d}
document.getElementById('verifyForm').onsubmit=async e=>{e.preventDefault();clear();if(!challengeId){msg(err,'Verification session not found. Please start Sign Up again.');return}verifyBtn.disabled=true;verifyBtn.textContent='Verifying...';try{const v=await api('/api/auth/verify-otp',{challengeId,code:otp.value.trim()});const d=await api('/api/auth/complete-signup',{challengeId,verificationToken:v.verificationToken});setUser(d.user);msg(ok,'✓ Email verified and account created successfully.');sessionStorage.removeItem('workPlaceSignupChallenge');sessionStorage.removeItem('workPlaceSignupEmail');setTimeout(()=>location.href='index.html',700)}catch(e){msg(err,e.message)}finally{verifyBtn.disabled=false;verifyBtn.textContent='Verify Email & Create Account'}};
resendBtn.onclick=async()=>{clear();if(!challengeId){msg(err,'Verification session not found.');return}resendBtn.disabled=true;resendBtn.textContent='Sending...';try{const d=await api('/api/auth/resend-signup-otp',{challengeId});msg(ok,d.message||'A new code was sent.')}catch(e){msg(err,e.message)}finally{resendBtn.disabled=false;resendBtn.textContent='Resend Code'}};
</script></body></html>
