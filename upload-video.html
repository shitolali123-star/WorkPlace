<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create — Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" alt="Work Place" class="brand-logo"></a><div class="navlinks"><a href="index.html">Home</a><a href="find-jobs.html">Jobs</a><a href="worker.html">Workers</a><a href="entertainment.html">Entertainment</a><a href="advertisement.html">Advertisement</a><a href="payments.html">Payments</a><a href="appeal-history.html">Appeals</a><a href="messaging.html" class="message-nav" title="Messaging">💬</a><a class="coin-nav" href="coins.html" title="Coins & Rewards"><img src="assets/work-place-coin-logo.png" alt="Coins" style="width:24px;height:24px;vertical-align:middle"></a><div class="notification-wrap"><button class="notification-button" type="button">🔔</button></div></div><div class="user-area"><a class="profile-icon-link" href="profile.html">👤</a></div></nav><main class="container"><section class="section"><h1 id="postTitle">Post Video</h1><p class="muted">Your channel is connected to your Work Place account.</p><form id="videoForm" class="form-grid"><div class="field full" id="videoFileField"><label>Video File</label><input type="file" name="video" accept="video/*"><small class="muted">Prototype: 200 MB maximum.</small></div><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Content Type</label><select name="type"><option>Video</option><option>Reel</option><option>Teaching Video</option></select></div><div class="field"><label>Category</label><select name="category"><option>News</option><option>Industrial</option><option>Entertainment</option><option>Web Series</option><option>Natok</option><option>Movie</option><option>Sports</option><option>Technology</option><option>Education</option><option>Music</option><option>Comedy</option><option>Documentary</option><option>Lifestyle</option><option>Cooking</option><option>Travel</option><option>Gaming</option><option>Health</option><option>Agriculture</option><option>Jobs &amp; Skills</option><option>Science</option><option>Religion</option><option>Fashion</option><option>Business</option><option>Automotive</option><option>Kids</option><option>Animation</option></select></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Thumbnail</label><input type="file" name="thumbnail" accept="image/*"></div><div class="field"><label>Visibility</label><select name="visibility"><option>Public</option><option>Private</option><option>Unlisted</option></select></div><div class="field"><label>Access</label><select name="access"><option>Free</option><option>Premium Video</option></select></div><div class="field"><label>Monetisation</label><select name="monetization"><option>Off</option><option>Use if channel is approved</option></select></div><div class="field full"><button id="publishBtn" class="btn btn-green">Publish Video</button> <a class="btn btn-light" href="index.html">Cancel</a></div></form></section></main><script src="script.js"></script><script>const qs=new URLSearchParams(location.search);const requested=qs.get('type')||'Video';const form=document.getElementById('videoForm');const type=form.type;const title=document.getElementById('postTitle');const fileField=document.getElementById('videoFileField');const btn=document.getElementById('publishBtn');if(requested==='Reel'||requested==='Teaching Video'||requested==='Video'){type.value=requested}title.textContent='Post '+(type.value||'Video');type.addEventListener('change',()=>title.textContent='Post '+type.value);form.onsubmit=e=>{e.preventDefault();if(!requireLogin())return;const f=e.target,file=f.video.files[0];if(!file){alert('Please choose a video file.');return}if(file.size>200*1024*1024){alert('Video is larger than 200 MB prototype limit.');return}const a=JSON.parse(localStorage.getItem('wp_uploadedVideos')||'[]');a.unshift({id:Date.now(),title:f.title.value,type:f.type.value,category:f.category.value,description:f.description.value,visibility:f.visibility.value,access:f.access.value,monetization:f.monetization.value,fileName:file.name,views:0,likes:0});localStorage.setItem('wp_uploadedVideos',JSON.stringify(a));alert((f.type.value==='Reel'?'Reel':f.type.value)+' post created successfully.');location.href='channel.html'}</script></body></html>
