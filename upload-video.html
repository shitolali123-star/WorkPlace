<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post Video - Work Place</title><link rel="stylesheet" href="style.css"></head><body><nav class="navbar"><a class="logo" href="index.html"><img src="assets/work-place-logo.png" class="brand-logo" alt="Work Place"></a><div class="navlinks"><a href="entertainment.html">Entertainment</a><a href="channel.html">Your Channel</a></div></nav><main class="container"><section class="section"><h1>Post a Video</h1><p class="muted">Your channel is automatically connected to your Work Place account.</p><form id="videoForm" class="form-grid"><div class="field full"><label>Video File</label><input type="file" name="video" accept="video/*" required><small class="muted">Prototype: 200 MB maximum.</small></div><div class="field"><label>Title</label><input name="title" required></div><div class="field"><label>Content Type</label><select name="type"><option>Shorts</option><option>Long Videos</option><option>Live</option><option>Teaching</option></select></div><div class="field full"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Thumbnail</label><input type="file" name="thumbnail" accept="image/*"></div><div class="field"><label>Visibility</label><select name="visibility"><option>Public</option><option>Private</option><option>Unlisted</option></select></div><div class="field"><label>Access</label><select name="access"><option>Free</option><option>Premium Video</option></select></div><div class="field"><label>Monetisation</label><select name="monetization"><option>Off</option><option>Use if channel is approved</option></select></div><div class="field full"><button class="btn">Publish Video</button></div></form></section></main><script src="script.js"></script><script>videoForm.onsubmit=e=>{e.preventDefault();if(!requireLogin())return;const f=e.target, file=f.video.files[0];if(file.size>200*1024*1024){alert('Video is larger than 200 MB prototype limit.');return}const a=JSON.parse(localStorage.getItem('wp_uploadedVideos')||'[]');a.unshift({id:Date.now(),title:f.title.value,type:f.type.value,description:f.description.value,visibility:f.visibility.value,access:f.access.value,monetization:f.monetization.value,fileName:file.name,views:0,likes:0});localStorage.setItem('wp_uploadedVideos',JSON.stringify(a));alert('Video post created successfully.');location.href='channel.html'}</script></body></html>
